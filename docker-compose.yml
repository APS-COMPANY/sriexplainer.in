services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on: [mongo]
    volumes: [uploads:/app/uploads]
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on: [api]
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [web, api]
volumes: { mongo-data: {}, uploads: {} }
