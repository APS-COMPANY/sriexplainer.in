name: sri_explainer_app
description: "Sri Explainer - Premium Comic & Anime Explanations Android Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation & Deep Linking
  go_router: ^14.0.1

  # Networking & HTTP
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local Storage & Cache
  flutter_secure_storage: ^9.2.1
  shared_preferences: ^2.2.3

  # Media & WebView for Rumble Video Player
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.15.0

  # Image Caching & UI Graphics
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  carousel_slider: ^5.0.0

  # UI Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
